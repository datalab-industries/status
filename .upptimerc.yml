# Change these first
owner: datalab-industries # Your GitHub organization or username, where this repository lives
repo: status # The name of this repository
assignees: # Users to assign downtime issues (optional)
  - ml-evs

workflowSchedule:
  uptime: "*/30 * * * *"

sites:
  - name: grafana
    url: https://grafana.datalab.industries
  - name: odbx
    url: https://odbx.science
  - name: odbx (OPTIMADE)
    url: https://optimade.odbx.science/v1/structures
  - name: odbx (OPTIMADE 2)
    url: https://optimade-gnome.odbx.science/v1/structures
  - name: odbx (OPTIMADE 3)
    url: https://optimade-misc.odbx.science/v1/structures
# Without this block, @upptime/status-page 1.17.0 crashes during export:
# src/routes/_layout.svelte reads config['status-website'].css and .js
# unguarded, so every route is written out as a 500 "Internal server error"
# page. Do not set `cname` here: upptime writes it to a CNAME file in
# gh-pages, which would claim datalab.industries from the org Pages site.
status-website:
  name: datalab.industries status
  introTitle: "Status of the datalab deployments managed by datalab.industries"
  # The org Pages site owns datalab.industries and serves this repo at
  # /status/, so sapper must be exported with `--basepath /status` or every
  # client asset 404s at the root. post-process.ts reads baseUrl for exactly
  # that, and does so without needing `cname`.
  baseUrl: /status
